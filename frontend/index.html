<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chatbot & DALL·E</title>

<style>

/* RESET */
*, *::before, *::after{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:linear-gradient(135deg,#f0f4ff,#e2e8f0);
    color:#1f2937;
    padding:20px;
    min-height:100vh;
}

/* TITLE */
h1{
    text-align:center;
    color:#2563eb;
    font-size:clamp(2rem,4vw,3rem);
    margin-bottom:2rem;
    font-weight:800;
}

/* TOP MENU */
.top-bar{
    display:flex;
    justify-content:flex-end;
    max-width:1400px;
    margin:0 auto 20px auto;
}

.menu{
    position:relative;
}

.menu-btn{
    width:45px;
    height:45px;
    border:none;
    border-radius:12px;
    background:white;
    cursor:pointer;
    font-size:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

/* IMPORTANT: hidden by default */
.dropdown{
    position:absolute;
    right:0;
    top:55px;
    display:none;
    flex-direction:column;
    min-width:170px;
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
    z-index:1000;
}

.dropdown button{
    border:none;
    background:white;
    padding:12px;
    text-align:left;
    cursor:pointer;
    font-size:15px;
}

.dropdown button:hover{
    background:#f3f4f6;
}

/* CONTAINER */
.form-container{
    max-width:1400px;
    margin:auto;
}

/* GRID FIX (IMPORTANT FIX ALIGNMENT) */
.sections-container{
    display:grid;
    grid-template-columns:repeat(2, minmax(0,1fr));
    gap:2rem;
    align-items:stretch; /* FORCE SAME HEIGHT */
}

/* BOXES */
.chat-section,
.image-section{
    background:white;
    border-radius:20px;
    padding:1.5rem;
    box-shadow:0 10px 25px rgba(0,0,0,.08);

    display:flex;
    flex-direction:column;
    gap:1rem;

    min-height:520px; /* same base height */
}

/* TITLES */
.chat-section h2,
.image-section h2{
    color:#2563eb;
}

p{
    color:#6b7280;
}

/* CHAT */
#chatbox{
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:12px;
    background:#f9fafb;
    height:350px;
    overflow-y:auto;
}

/* MESSAGES */
.message{
    display:flex;
    margin:6px 0;
}

.user-message{
    justify-content:flex-end;
}

.bot-message{
    justify-content:flex-start;
}

.bubble{
    padding:10px 15px;
    border-radius:15px;
    max-width:75%;
    word-wrap:break-word;
}

.user-message .bubble{
    background:#dbeafe;
    color:#1e3a8a;
}

.bot-message .bubble{
    background:#dcfce7;
    color:#166534;
}

/* INPUTS */
.line-form{
    display:flex;
    gap:10px;
}

.line-form input{
    flex:1;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:1rem;
}

.line-form input:focus{
    outline:none;
    border-color:#2563eb;
}

.line-form button{
    border:none;
    padding:12px 18px;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-weight:600;
}

.line-form button:hover{
    opacity:.9;
}

/* IMAGE */
#imageBox img{
    max-width:100%;
    border-radius:15px;
    margin-top:10px;
}

/* FOOTER */
.footer{
    text-align:center;
    margin-top:2rem;
    color:#6b7280;
}

/* TABLET */
@media(max-width:900px){
    .sections-container{
        grid-template-columns:1fr;
    }

    .chat-section,
    .image-section{
        min-height:auto;
    }
}

/* MOBILE */
@media(max-width:600px){
    body{
        padding:12px;
    }

    .line-form{
        flex-direction:column;
    }

    .line-form button{
        width:100%;
    }
}

</style>
</head>

<body>

<!-- MENU -->
<div class="top-bar">

    <div class="menu">

        <button class="menu-btn" onclick="toggleMenu()">
            ☰
        </button>

        <div class="dropdown" id="dropdownMenu">

            <button onclick="goHome()">
                🏠 Accueil
            </button>

            <button onclick="quitSite()">
                🚪 Quitter
            </button>

        </div>

    </div>

</div>

<div class="form-container">

    <h1>Bienvenue sur l'app</h1>

    <div class="sections-container">

        <!-- CHAT -->
        <section class="chat-section">

            <h2>💬 Chat avec le bot</h2>

            <p>Posez une question au chatbot et obtenez une réponse instantanée.</p>

            <div id="chatbox"></div>

            <div class="line-form">

                <input type="text" id="msg" placeholder="Ex : capitale de la France ?">

                <button onclick="sendMessage()">Envoyer</button>

            </div>

        </section>

        <!-- IMAGE -->
        <section class="image-section">

            <h2>🎨 Génération d'images IA</h2>

            <p>Décrivez l'image que vous souhaitez générer.</p>

            <div class="line-form">

                <input type="text" id="prompt" placeholder="Ex : chat pirate sur bateau">

                <button onclick="generateImage()">Générer</button>

            </div>

            <div id="imageBox"></div>

        </section>

    </div>

    <div class="footer">
        Amusez-vous !
    </div>

</div>

  <script>

  function toggleMenu(){
      const menu = document.getElementById("dropdownMenu");
      menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
  }

  document.addEventListener("click", function(e){
      const menu = document.getElementById("dropdownMenu");
      const btn = document.querySelector(".menu-btn");

      if(!menu.contains(e.target) && !btn.contains(e.target)){
          menu.style.display = "none";
      }
  });

  function goHome(){
      window.location.href = "/";
  }

  function quitSite(){
      window.location.href = "about:blank";
  }

  </script>
<script src="main.js"></script>

</body>
</html>
